name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # src, not paths in args: the action appends the workspace to args, so a
      # path there makes it lint the whole checkout including the README.
      # Pinned, so a new ruff release cannot fail a commit that passed locally.
      # Raise it here and locally together.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: check
          src: "./custom_components ./tests"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          args: format --check
          src: "./custom_components ./tests"

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      # The floor is the measured total rounded down. config_flow.py is a Bronze
      # rule on its own, so it is held at 100 separately.
      - run: pytest --cov=custom_components.jev --cov-report=term-missing --cov-fail-under=96
      - run: coverage report --include='custom_components/jev/config_flow.py' --fail-under=100

  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt mypy==2.3.1
      # Platinum's strict-typing rule. Worth enforcing rather than claiming.
      - run: mypy --strict --ignore-missing-imports custom_components/jev
