# The Home Assistant config the live script drives. Copy the pieces you need into a
# throwaway instance; it is not meant for a real one.
#
# input_number.wasmachine_watt stands in for a power sensor, and the input_text
# helpers exist so an automation can write its answer somewhere a test can read.

input_number:
  wasmachine_watt:
    min: 0
    max: 3000
    initial: 1.2
    step: 0.1

input_boolean:
  bijkeuken_deur_dicht:
    initial: true

input_text:
  jev_template_result:
    initial: unset
    max: 100
  jev_target_result:
    initial: unset
    max: 100
  jev_probe:
    initial: start
    max: 100
  jev_vars_result:
    initial: unset
    max: 100

jev: debug

input_number:
  wasmachine_watt:
    min: 0
    max: 3000
    initial: 1.2
    step: 0.1

input_boolean:
  bijkeuken_deur_dicht:
    initial: true

input_text:
  jev_template_result:
    initial: unset
    max: 100
  jev_target_result:
    initial: unset
    max: 100
  jev_probe:
    initial: start
    max: 100
  jev_vars_result:
    initial: unset
    max: 100

jev:
  - name: Laundry
    scan_interval: 300
    entities:
      - input_number.wasmachine_watt
      - input_boolean.bijkeuken_deur_dicht
    questions:
      - name: Laundry forgotten
        type: noul
        instructions: Is the washing machine idle, suggesting the programme has finished?
        threshold: 0.7

automation:
  # The template path: the script engine renders `state` before the action sees it,
  # which is the one thing a REST call never exercises.
  - alias: Jev template path
    id: jev_template_path
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_number.wasmachine_watt
    actions:
      - action: jev.noul
        response_variable: verdict
        data:
          state: >-
            The washing machine is
            {% if states('input_number.wasmachine_watt') | float(0) < 5 %}
            drawing almost no power, which means it is idle
            {% else %}
            drawing {{ states('input_number.wasmachine_watt') }} W, which means a
            programme is running
            {% endif %}.
            A programme was started 40 minutes ago, and nobody has entered the
            laundry room since.
          instructions: Is the laundry finished but still sitting in the machine?
          true_means: The programme is done and nobody has emptied it
          false_means: Still running, or already emptied
          threshold: 0.6
      - action: input_text.set_value
        target:
          entity_id: input_text.jev_template_result
        data:
          value: "{{ verdict.noul }}|{{ verdict.is_true }}|{{ verdict.usage.input_tokens }}"

  # The target path: no text at all, the entities are the input.
  - alias: Jev target path
    id: jev_target_path
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_boolean.bijkeuken_deur_dicht
    actions:
      - action: jev.choice
        response_variable: room
        target:
          entity_id:
            - input_number.wasmachine_watt
            - input_boolean.bijkeuken_deur_dicht
        data:
          instructions: Which room do these readings concern?
          options: [laundry, kitchen, bathroom, other]
          option_descriptions:
            laundry: Washing machine and dryer
            kitchen: Cooking and dishwasher
      - action: input_text.set_value
        target:
          entity_id: input_text.jev_target_result
        data:
          value: "{{ room.choice }}|{{ room.confidence }}"
  # Does everything an automation can offer reach the action: trigger data, a
  # variables block, and a variable holding a mapping rather than a string.
  - alias: Jev variables path
    id: jev_variables_path
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_text.jev_probe
    variables:
      room_name: bijkeuken
      machine:
        brand: Miele
        idle_watts: 5
        running_watts: 300
    actions:
      - action: jev.ask
        response_variable: probe
        data:
          state:
            trigger_value: "{{ trigger.to_state.state }}"
            room: "{{ room_name }}"
            machine: "{{ machine }}"
          questions:
            room:
              type: choice
              instructions: Which room does `room` name?
              criteria:
                bijkeuken: The laundry room
                keuken: The kitchen
                badkamer: The bathroom
            brand:
              type: choice
              instructions: Which brand is named under `machine`?
              criteria:
                Miele: Miele
                Bosch: Bosch
                Siemens: Siemens
            trigger_seen:
              type: noul
              instructions: Does `trigger_value` contain the word ZEBRA?
            nested_number:
              type: noul
              instructions: Is `machine.idle_watts` exactly 5?
      - action: input_text.set_value
        target:
          entity_id: input_text.jev_vars_result
        data:
          value: >-
            {{ probe.answers.room.choice }}|{{ probe.answers.brand.choice }}|{{
            probe.answers.trigger_seen.noul }}|{{ probe.answers.nested_number.noul }}

