# The docs site, built from site-docs/ and deployed to GitHub Pages.
#
# mkdocs-material rather than a hosted service: the repository's toolchain is
# already Python, so this adds no Node dependency, and the deploy is one workflow
# against Pages rather than an account with someone else's business.

site_name: "Jev for Home Assistant"
site_url: "https://abovecolin.github.io/HA-Jev/"
site_description: >-
  Ask your house a typed question and get a probability, a choice or a score back
  as an entity. A Home Assistant integration for TypeSafe Jev.
site_author: "AboveColin"
copyright: "Not affiliated with TypeSafe."

repo_name: "AboveColin/HA-Jev"
repo_url: "https://github.com/AboveColin/HA-Jev"
edit_uri: "edit/main/site-docs/"
docs_dir: "site-docs"

theme:
  name: "material"
  language: "en"
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: "light-blue"
      accent: "light-blue"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: "light-blue"
      accent: "light-blue"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Your first question: first-question.md
  - Asking questions:
      - The three answers: primitives.md
      - Questions in the UI: questions-ui.md
      - Questions in YAML: questions-yaml.md
      - Writing a question that works: writing-questions.md
  - In automations:
      - Actions: actions.md
      - Examples: examples.md
  - Voice:
      - Conversation agent: conversation.md
  - Reference:
      - What it costs: cost.md
      - Measurements: measurements.md
      - Troubleshooting: troubleshooting.md
      - Limitations: limitations.md
