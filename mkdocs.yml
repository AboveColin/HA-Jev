# The docs site, built from site-docs/ and deployed to GitHub Pages.
#
# mkdocs-material rather than a hosted service: the repository's toolchain is
# already Python, so this adds no Node dependency, and the deploy is one workflow
# against Pages rather than an account with someone else's business.

site_name: "Jev for Home Assistant"
site_url: "https://jev.cdevries.dev/"
site_description: >-
  Ask your house a typed question and get a probability, a choice or a score back
  as an entity. A Home Assistant integration for TypeSafe Jev.
site_author: "AboveColin"
copyright: "Not affiliated with TypeSafe."

repo_name: "AboveColin/HA-Jev"
repo_url: "https://github.com/AboveColin/HA-Jev"
edit_uri: "edit/main/site-docs/"
docs_dir: "site-docs"

exclude_docs: |
  images/README.md

theme:
  name: "material"
  language: "en"
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: "light-blue"
      accent: "light-blue"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: "light-blue"
      accent: "light-blue"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.action.edit
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

# llms.txt lists every page for an agent, llms-full.txt holds all of them in one
# file, and each page is also served as Markdown next to its HTML. A page missing
# from sections below gets no Markdown copy. Listing plugins replaces the default
# set, so search is named here to keep it.
plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        A Home Assistant custom integration, installed through HACS. Questions become
        sensors: a probability, one of a set of options, or a number on a scale. Four
        actions (jev.noul, jev.choice, jev.score, jev.ask) answer inside an
        automation, jev.calibrate fits a threshold from history, an AI Task entity answers ai_task.generate_data, and a
        conversation agent handles Assist. Every call is billed in input tokens
        against an optional daily budget.
      sections:
        Getting started:
          - index.md: What Jev is and what it answers
          - install.md: Requirements, HACS install and the API key
          - first-question.md: Add a question in the UI and read its sensor
        Asking questions:
          - primitives.md: The three question types and what each returns
          - questions-ui.md: Every field of the question form
          - questions-yaml.md: The configuration.yaml schema for questions
          - writing-questions.md: How to word a question so the answer moves with the state
        In automations:
          - actions.md: The four actions, their fields and their response variables
          - ai-task.md: The ai_task.generate_data entity and the structures it accepts
          - examples.md: Worked automations
          - calibrate.md: jev.calibrate, a threshold measured from recorder history
        Voice:
          - conversation.md: The Assist conversation agent and what it will not control
          - llm-tools.md: The jev__noul and jev__choice tools for other LLM agents
        Reference:
          - bayesian.md: When to use Jev and when the Bayesian binary sensor
          - cost.md: Token billing, the usage sensors, a month worked out and the daily budget
          - measurements.md: Latency and answer quality measured against the live API
          - troubleshooting.md: Debug logging and the common failures
          - limitations.md: What Jev does not do

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Your first question: first-question.md
  - Asking questions:
      - The three answers: primitives.md
      - Questions in the UI: questions-ui.md
      - Questions in YAML: questions-yaml.md
      - Writing a question that works: writing-questions.md
  - In automations:
      - Actions: actions.md
      - AI Task: ai-task.md
      - Examples: examples.md
      - Tuning a threshold: calibrate.md
  - Voice:
      - Conversation agent: conversation.md
      - Tools for other LLM agents: llm-tools.md
  - Reference:
      - Jev and the Bayesian sensor: bayesian.md
      - What it costs: cost.md
      - Measurements: measurements.md
      - Troubleshooting: troubleshooting.md
      - Limitations: limitations.md
